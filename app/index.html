<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ephemeris</title>
    <script>
      // Paint the theme before the first frame, so a dark-theme reader does not
      // get a white flash while the bundle loads. Deliberately inline, blocking
      // and duplicated from src/lib/theme.ts — a module import would be too late,
      // and the storage key is the contract between the two.
      try {
        var pref = window.localStorage.getItem('ephemeris_theme') || 'system';
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        // No storage (private window, blocked site data) — light, and the app
        // will sort itself out once it mounts.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
