# The whole stack, built from this checkout: `docker compose up --build`.
name: ephemeris

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ephemeris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ephemeris}
      POSTGRES_DB: ephemeris
    volumes:
      - ephemeris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephemeris -d ephemeris"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ephemeris:${POSTGRES_PASSWORD:-ephemeris}@postgres:5432/ephemeris
      # Required. The server refuses to start in production without it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. `openssl rand -hex 32`}
      # The address people type. Magic links are built from it, so a wrong value
      # here is a link that goes nowhere.
      APP_URL: ${APP_URL:-http://localhost:3005}
      # Set to true only on a network where nothing hostile can reach this port:
      # it makes an email address the entire credential.
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
    ports:
      - "${PORT:-3005}:3005"

volumes:
  ephemeris_pgdata:
