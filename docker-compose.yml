# The whole stack. `docker compose up -d` runs the published image; add `--build` to build this checkout.
name: ephemeris
services:
  ephemeris:
    image: ghcr.io/cubicecho/ephemeris:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # Required. The server refuses to start in production without it.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Generate one with `openssl rand -hex 32`}
      DATABASE_URL: postgres://ephemeris:${POSTGRES_PASSWORD:-ephemeris}@postgres:5432/ephemeris
      # The address people type. Magic links are built from it, so a wrong value is a link that goes nowhere.
      APP_URL: ${APP_URL:-http://localhost:3005}
      # true only where nothing hostile can reach this port: it makes an email address the entire credential.
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
      # The proxies in front that may set X-Forwarded-For. The sign-in throttle counts by client address.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: production
    ports:
      - "${PORT:-3005}:3005"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: ephemeris, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ephemeris}", POSTGRES_DB: ephemeris }
    # No `ports`. The database is for the app beside it.
    volumes: [ephemeris_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephemeris -d ephemeris"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ephemeris_pgdata:
